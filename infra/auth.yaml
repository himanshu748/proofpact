AWSTemplateFormatVersion: '2010-09-09'
Description: ProofPact verified client and freelancer accounts.
Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: proofpact-accounts
      UsernameAttributes: [email]
      UsernameConfiguration: {CaseSensitive: false}
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms: [{Name: verified_email, Priority: 1}]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      Schema:
        - {Name: email, AttributeDataType: String, Required: true, Mutable: false}
        - {Name: name, AttributeDataType: String, Required: true, Mutable: true}
        - Name: role
          AttributeDataType: String
          Mutable: false
          StringAttributeConstraints: {MinLength: '6', MaxLength: '7'}
      UserPoolTags: {Project: ProofPact}
  AppClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: proofpact-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 1
      TokenValidityUnits: {AccessToken: hours, IdToken: hours, RefreshToken: days}
      ReadAttributes: [email, email_verified, name, custom:role]
      WriteAttributes: [email, name, custom:role]
Outputs:
  UserPoolId: {Value: !Ref UserPool}
  ClientId: {Value: !Ref AppClient}
